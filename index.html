<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>店着時間記録アプリ</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="店着記録" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f172a" />
  <link id="dynamic-favicon" rel="icon" type="image/png" />
  <link id="dynamic-apple-icon" rel="apple-touch-icon" />
  <link id="dynamic-manifest" rel="manifest" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0.5; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes pulseSoft {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    .animate-pulse-soft {
      animation: pulseSoft 1.8s infinite;
    }
    .wheel-col {
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .wheel-item {
      scroll-snap-align: center;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease, color 0.12s ease, opacity 0.12s ease;
      user-select: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 上部固定ヘッダー -->
  <header class="sticky top-0 z-30 bg-slate-900 text-white shadow-md">
    <div class="max-w-lg mx-auto px-3.5 pt-2.5 pb-2">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <div class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center shrink-0 shadow-inner">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 17h8M8 17a2 2 0 11-4 0 2 2 0 014 0zm8 0a2 2 0 104 0 2 2 0 00-4 0zM3 9h13l4 4v4h-2m-15 0H2v-6a2 2 0 012-2h11v8" />
            </svg>
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <span id="header-car-label" class="text-base font-extrabold tracking-tight truncate">15号車</span>
              <span id="connection-badge" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold bg-slate-800 text-slate-300 border border-slate-700">
                <span id="connection-dot" class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>
                <span id="connection-text">未接続</span>
              </span>
            </div>
            <div id="header-date-clock" class="text-[11px] text-slate-400 tabular-nums truncate">読み込み中...</div>
          </div>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
          <!-- 事務所電話発信ボタン -->
          <a id="office-call-link" href="tel:" class="p-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition text-white shadow-sm flex items-center justify-center" title="事務所へ電話">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
            </svg>
          </a>

          <!-- メッセージ画面ボタン -->
          <button id="open-chat-screen-btn" type="button" class="relative p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 transition text-slate-200 border border-slate-700" title="事務所連絡チャット">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
            </svg>
            <span id="chat-unread-badge" class="hidden absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-rose-500 text-white text-[10px] font-extrabold flex items-center justify-center shadow">1</span>
          </button>

          <!-- 更新ボタン（ダブルタップで強制リロード） -->
          <button id="refresh-btn" type="button" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 transition text-slate-200 border border-slate-700" title="データ更新（ダブルタップで再起動）">
            <svg id="refresh-icon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
          </button>

          <!-- 設定歯車ボタン -->
          <button id="open-settings-btn" type="button" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 transition text-slate-200 border border-slate-700" title="接続・号車設定">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </button>
        </div>
      </div>

      <!-- 1便 / 2便 切り替えタブ -->
      <div class="grid grid-cols-2 gap-2 mt-2.5 bg-slate-800/90 p-1 rounded-2xl border border-slate-700/80">
        <button id="tab-course-1" type="button" class="py-2 px-3 rounded-xl text-sm font-extrabold transition flex items-center justify-center gap-1.5 bg-blue-600 text-white shadow">
          <span>1便</span>
          <span id="tab-course-1-code" class="text-xs opacity-90 font-bold">(115)</span>
          <span id="tab-course-1-progress" class="ml-1 text-[11px] px-1.5 py-0.2 rounded-full bg-black/25 tabular-nums">0/0</span>
        </button>
        <button id="tab-course-2" type="button" class="py-2 px-3 rounded-xl text-sm font-extrabold transition flex items-center justify-center gap-1.5 text-slate-300 hover:text-white">
          <span>2便</span>
          <span id="tab-course-2-code" class="text-xs opacity-80 font-bold">(215)</span>
          <span id="tab-course-2-progress" class="ml-1 text-[11px] px-1.5 py-0.2 rounded-full bg-slate-700 tabular-nums">0/0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 事務所からの未確認伝言バナー -->
  <div id="dispatch-memo-banner" class="hidden max-w-lg mx-auto w-full px-3.5 pt-3">
    <div class="bg-amber-50 border-2 border-amber-400 rounded-2xl p-3.5 shadow-sm">
      <div class="flex items-start justify-between gap-2">
        <div class="flex items-center gap-1.5 text-amber-800 font-extrabold text-xs">
          <span class="px-2 py-0.5 rounded-full bg-amber-400 text-amber-950">事務所伝言</span>
          <span id="dispatch-memo-time" class="tabular-nums opacity-80"></span>
        </div>
        <button id="confirm-memo-btn" type="button" class="px-3 py-1.5 rounded-xl bg-amber-600 hover:bg-amber-700 active:scale-95 text-white text-xs font-extrabold shadow-sm transition">
          確認しました
        </button>
      </div>
      <p id="dispatch-memo-text" class="mt-2 text-sm font-bold text-slate-900 whitespace-pre-wrap leading-relaxed"></p>
    </div>
  </div>

  <!-- メイン店舗リスト -->
  <main class="flex-1 max-w-lg mx-auto w-full px-3.5 py-3 pb-24">
    <div class="flex items-center justify-between mb-2 px-0.5">
      <div class="flex items-center gap-2">
        <span id="current-course-heading" class="text-xs font-extrabold text-slate-500 uppercase tracking-wider">1便 納品先一覧</span>
        <span id="delivery-date-chip" class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-slate-200/80 text-slate-700 tabular-nums"></span>
      </div>
      <button id="open-history-btn" type="button" class="text-xs font-bold text-blue-600 hover:text-blue-700 flex items-center gap-1 py-1 px-2 rounded-lg hover:bg-blue-50 transition">
        <span>送信履歴</span>
        <span id="history-count-badge" class="px-1.5 py-0.2 rounded-full bg-blue-100 text-blue-700 tabular-nums">0</span>
      </button>
    </div>

    <div id="store-list-container" class="space-y-2.5">
      <!-- JSで動的描画 -->
    </div>
  </main>

  <!-- トースト通知 -->
  <div id="toast-box" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-200 opacity-0 -translate-y-2">
    <div id="toast-message" class="px-4 py-2.5 rounded-2xl bg-slate-900/95 text-white text-xs font-bold shadow-xl border border-slate-700 whitespace-nowrap"></div>
  </div>

  <!-- 店着時間入力モーダル -->
  <div id="arrival-modal" class="fixed inset-0 z-40 hidden items-end sm:items-center justify-center bg-slate-950/60 backdrop-blur-[1px]">
    <div class="w-full max-w-lg bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-hidden animate-slide-up">
      <div class="px-5 pt-4 pb-3 bg-slate-900 text-white flex items-center justify-between">
        <div class="min-w-0 pr-2">
          <div class="flex items-center gap-2">
            <span id="modal-store-order" class="px-2 py-0.5 rounded-lg bg-blue-600 text-xs font-extrabold">1店舗目</span>
            <span id="modal-store-sched" class="text-xs font-bold text-slate-300 tabular-nums">予定 00:00</span>
          </div>
          <h3 id="modal-store-name" class="text-lg font-extrabold truncate mt-1">店舗名</h3>
        </div>
        <button id="close-arrival-modal-btn" type="button" class="p-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="p-5 space-y-4">
        <!-- 時刻ドラムロール＆クイックボタン -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-extrabold text-slate-500">実店着時間</span>
            <div class="flex items-center gap-1.5">
              <button id="set-now-time-btn" type="button" class="px-2.5 py-1 rounded-lg bg-blue-50 text-blue-700 text-xs font-extrabold border border-blue-200 active:scale-95 transition">現在時刻</button>
              <button id="minus-5min-btn" type="button" class="px-2 py-1 rounded-lg bg-slate-100 text-slate-700 text-xs font-bold active:scale-95 transition">-5分</button>
              <button id="plus-5min-btn" type="button" class="px-2 py-1 rounded-lg bg-slate-100 text-slate-700 text-xs font-bold active:scale-95 transition">+5分</button>
            </div>
          </div>

          <!-- ドラムロールピッカー -->
          <div class="relative h-[132px] bg-slate-100 rounded-2xl border border-slate-200 overflow-hidden grid grid-cols-2">
            <div class="pointer-events-none absolute inset-x-3 top-1/2 -translate-y-1/2 h-[44px] rounded-xl bg-white shadow-sm border border-blue-200/80 z-0"></div>
            <div class="pointer-events-none absolute inset-x-0 top-0 h-9 bg-gradient-to-b from-slate-100 to-transparent z-10"></div>
            <div class="pointer-events-none absolute inset-x-0 bottom-0 h-9 bg-gradient-to-t from-slate-100 to-transparent z-10"></div>

            <div id="wheel-hour" class="wheel-col relative z-20 h-full overflow-y-auto no-scrollbar py-[44px]"></div>
            <div id="wheel-minute" class="wheel-col relative z-20 h-full overflow-y-auto no-scrollbar py-[44px]"></div>
            <div class="pointer-events-none absolute inset-0 flex items-center justify-center z-20 font-black text-slate-400 text-lg">:</div>
          </div>

          <!-- 予定との差分プレビュー -->
          <div class="mt-2.5 flex items-center justify-between px-3.5 py-2 rounded-xl bg-slate-50 border border-slate-200/80">
            <span class="text-xs font-bold text-slate-500">予定時刻との差</span>
            <span id="modal-diff-preview" class="text-sm font-extrabold tabular-nums text-slate-800">±0分</span>
          </div>
        </div>

        <!-- 最終店舗のみ表示：DR送信時刻 -->
        <div id="dr-sent-section" class="hidden p-3.5 rounded-2xl bg-indigo-50/80 border border-indigo-200 space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-extrabold text-indigo-900">最終店舗：DR送信時刻</span>
            <button id="set-dr-now-btn" type="button" class="px-2.5 py-1 rounded-lg bg-indigo-600 text-white text-xs font-bold active:scale-95 transition">現在時刻をセット</button>
          </div>
          <input id="dr-sent-time-input" type="time" class="w-full px-3 py-2 rounded-xl bg-white border border-indigo-200 text-base font-extrabold text-slate-900 tabular-nums" />
        </div>

        <!-- 特殊ステータス（休業・臨時便） -->
        <div class="grid grid-cols-2 gap-2">
          <button id="submit-holiday-btn" type="button" class="py-2.5 px-3 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-900 font-extrabold text-xs border border-amber-300 active:scale-95 transition">
            店舗休業として記録
          </button>
          <button id="toggle-extra-btn" type="button" class="py-2.5 px-3 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-800 font-extrabold text-xs border border-purple-200 active:scale-95 transition">
            臨時便フラグ：OFF
          </button>
        </div>

        <!-- 送信メインボタン -->
        <button id="submit-arrival-btn" type="button" class="w-full py-3.5 rounded-2xl bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-extrabold text-base shadow-lg shadow-blue-600/25 transition flex items-center justify-center gap-2">
          <span>この時間で記録を送信</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 送信履歴モーダル -->
  <div id="history-modal" class="fixed inset-0 z-40 hidden items-end sm:items-center justify-center bg-slate-950/60">
    <div class="w-full max-w-lg bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[82vh] flex flex-col overflow-hidden animate-slide-up">
      <div class="px-5 py-4 bg-slate-900 text-white flex items-center justify-between shrink-0">
        <h3 class="text-base font-extrabold">本日の記録履歴</h3>
        <button id="close-history-modal-btn" type="button" class="p-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div id="history-list-container" class="p-4 overflow-y-auto space-y-2 flex-1"></div>
    </div>
  </div>

  <!-- 設定・QRコード発行モーダル -->
  <div id="gas-modal" class="fixed inset-0 z-40 hidden items-end sm:items-center justify-center bg-slate-950/60">
    <div class="w-full max-w-lg bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[90vh] flex flex-col overflow-hidden animate-slide-up">
      <div class="px-5 py-4 bg-slate-900 text-white flex items-center justify-between shrink-0">
        <h3 class="text-base font-extrabold">接続・号車設定</h3>
        <button id="close-gas-modal-btn" type="button" class="p-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="p-5 overflow-y-auto space-y-4 flex-1">
        <div>
          <label class="block text-xs font-extrabold text-slate-600 mb-1">担当号車</label>
          <select id="setting-car-select" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-300 text-sm font-extrabold text-slate-900"></select>
        </div>

        <div>
          <label class="block text-xs font-extrabold text-slate-600 mb-1">GAS ウェブアプリURL（末尾 /exec）</label>
          <input id="setting-gas-url" type="url" placeholder="https://script.google.com/macros/s/.../exec" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-300 text-xs font-mono text-slate-800" />
        </div>

        <div>
          <label class="block text-xs font-extrabold text-slate-600 mb-1">運行携帯 電話番号（電話マーク発信先）</label>
          <input id="setting-office-phone" type="tel" placeholder="例: 090-1234-5678" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-300 text-sm font-bold text-slate-900" />
        </div>

        <button id="save-gas-settings-btn" type="button" class="w-full py-3 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-sm shadow-md transition">
          接続を保存してデータ読込
        </button>

        <!-- 他端末導入用 QRコード発行 -->
        <div class="pt-3 border-t border-slate-200 space-y-2.5">
          <div class="text-xs font-extrabold text-slate-700">他端末導入用 QRコード発行</div>
          <p class="text-[11px] text-slate-500 leading-relaxed">現在のGAS接続URLと運行電話番号を組み込んだ専用QRコードを発行します。</p>
          <div class="flex gap-2">
            <select id="qr-target-car-select" class="flex-1 px-3 py-2 rounded-xl bg-slate-50 border border-slate-300 text-sm font-bold text-slate-900"></select>
            <button id="generate-qr-btn" type="button" class="px-4 py-2 rounded-xl bg-slate-800 text-white text-xs font-extrabold hover:bg-slate-700 transition">
              QR表示
            </button>
          </div>
          <div id="qr-display-area" class="hidden flex-col items-center p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-2">
            <img id="qr-code-img" alt="QRコード" class="w-44 h-44 rounded-xl bg-white p-2 shadow-sm border border-slate-200" />
            <div id="qr-target-label" class="text-xs font-extrabold text-slate-800"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 事務所連絡チャットサブ画面 -->
  <div id="chat-sub-screen" class="fixed inset-0 z-40 hidden flex-col bg-slate-100">
    <div class="bg-slate-900 text-white px-4 py-3 flex items-center justify-between shrink-0 shadow">
      <div class="flex items-center gap-2">
        <button id="close-chat-screen-btn" type="button" class="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-extrabold flex items-center gap-1">
          <span>← 店着画面へ</span>
        </button>
        <h2 id="chat-header-title" class="text-sm font-extrabold">事務所連絡</h2>
      </div>
      <button id="refresh-chat-btn" type="button" class="p-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white text-xs font-bold">更新</button>
    </div>

    <div id="chat-messages-container" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

    <!-- 画像プレビュー -->
    <div id="chat-image-preview-bar" class="hidden px-4 py-2 bg-slate-200 border-t border-slate-300 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <img id="chat-image-preview-thumb" alt="添付プレビュー" class="w-12 h-12 object-cover rounded-lg border border-slate-400" />
        <span class="text-xs font-bold text-slate-700">画像を添付中</span>
      </div>
      <button id="remove-chat-image-btn" type="button" class="px-2.5 py-1 rounded-lg bg-slate-700 text-white text-xs font-bold">取消</button>
    </div>

    <div class="p-3 bg-white border-t border-slate-200 flex items-end gap-2 shrink-0">
      <label class="p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 cursor-pointer shrink-0">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <input id="chat-image-input" type="file" accept="image/*" class="hidden" />
      </label>
      <textarea id="chat-message-input" rows="1" placeholder="事務所へ連絡を入力..." class="flex-1 px-3.5 py-2.5 rounded-2xl bg-slate-100 border border-slate-300 text-sm focus:outline-none focus:border-blue-500 resize-none max-h-28"></textarea>
      <button id="send-chat-btn" type="button" class="px-4 py-2.5 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-sm shrink-0 shadow-sm active:scale-95 transition">
        送信
      </button>
    </div>
  </div>

  <script>
    const STORAGE_KEYS = {
      CAR_INDEX: 'tenchaku_car_index_v2',
      GAS_URL: 'tenchaku_gas_url_v2',
      OFFICE_PHONE: 'tenchaku_office_phone_v2',
      SCHEDULE_CACHE: 'tenchaku_schedule_cache_v2',
      LAST_READ_CHAT_ID: 'tenchaku_last_read_chat_v2'
    };

    const DEMO_STORES_1 = [
      { order: 1, name: 'サンプル店舗A', scheduled: '19:30', avgArrival: '19:15' },
      { order: 2, name: 'サンプル店舗B', scheduled: '20:15', avgArrival: '20:00' },
      { order: 3, name: 'サンプル店舗C', scheduled: '21:00', avgArrival: '20:45' }
    ];
    const DEMO_STORES_2 = [
      { order: 1, name: 'サンプル2便店舗X', scheduled: '01:30', avgArrival: '01:10' },
      { order: 2, name: 'サンプル2便店舗Y', scheduled: '02:20', avgArrival: '02:00' }
    ];

    let excelCarIndex = 15;
    let gasWebAppUrl = '';
    let officePhoneNumber = '';
    let activeCourse = '1';
    let course1Code = '115';
    let course2Code = '215';
    let course1Stores = [...DEMO_STORES_1];
    let course2Stores = [...DEMO_STORES_2];
    let arrivalLogs = [];
    let activeDispatchMemo = null;
    let chatMessagesList = [];
    let selectedStoreForModal = null;
    let modalExtraRunFlag = false;
    let pendingChatImageBase64 = '';
    let hourWheelController = null;
    let minuteWheelController = null;
    let isFetchingSheetData = false;
    let hasLoadedOnce = false;

    function pad2(n) {
      return String(n).padStart(2, '0');
    }

    function getEffectiveDeliveryDateObj() {
      const now = new Date();
      if (now.getHours() < 12) {
        now.setDate(now.getDate() - 1);
      }
      return new Date(now.getFullYear(), now.getMonth(), now.getDate());
    }

    function getFormattedDeliveryDateKey() {
      const d = getEffectiveDeliveryDateObj();
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }

    function initFromUrlOrStorage() {
      const params = new URLSearchParams(window.location.search);
      const urlCar = params.get('car');
      const urlGas = params.get('gas');
      const urlPhone = params.get('phone');

      if (urlCar !== null && !isNaN(Number(urlCar))) {
        excelCarIndex = Number(urlCar);
        localStorage.setItem(STORAGE_KEYS.CAR_INDEX, String(excelCarIndex));
      } else {
        const savedCar = localStorage.getItem(STORAGE_KEYS.CAR_INDEX);
        if (savedCar !== null && !isNaN(Number(savedCar))) {
          excelCarIndex = Number(savedCar);
        }
      }

      if (urlGas) {
        gasWebAppUrl = urlGas.trim();
        localStorage.setItem(STORAGE_KEYS.GAS_URL, gasWebAppUrl);
      } else {
        gasWebAppUrl = (localStorage.getItem(STORAGE_KEYS.GAS_URL) || '').trim();
      }

      if (urlPhone) {
        officePhoneNumber = urlPhone.trim();
        localStorage.setItem(STORAGE_KEYS.OFFICE_PHONE, officePhoneNumber);
      } else {
        officePhoneNumber = (localStorage.getItem(STORAGE_KEYS.OFFICE_PHONE) || '').trim();
      }

      if (urlCar || urlGas || urlPhone) {
        try {
          window.history.replaceState({}, document.title, window.location.pathname);
        } catch (e) {}
      }

      course1Code = String(100 + excelCarIndex);
      course2Code = String(200 + excelCarIndex);
      document.getElementById('header-car-label').textContent = excelCarIndex === 0 ? '0号車(管理)' : `${excelCarIndex}号車`;
    }

    function generateAppIcons() {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 192;
        canvas.height = 192;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#1d4ed8';
        ctx.beginPath();
        ctx.roundRect(0, 0, 192, 192, 42);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 74px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('店着', 96, 100);

        const pngUrl = canvas.toDataURL('image/png');
        document.getElementById('dynamic-favicon').href = pngUrl;
        document.getElementById('dynamic-apple-icon').href = pngUrl;
      } catch (e) {}
    }

    function updateOfficeCallLink() {
      const link = document.getElementById('office-call-link');
      if (officePhoneNumber) {
        link.href = `tel:${officePhoneNumber.replace(/[^0-9+]/g, '')}`;
        link.classList.remove('opacity-50');
      } else {
        link.href = '#';
        link.classList.add('opacity-50');
      }
    }

    function showToast(msg) {
      const box = document.getElementById('toast-box');
      const text = document.getElementById('toast-message');
      text.textContent = msg;
      box.classList.remove('opacity-0', '-translate-y-2');
      box.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        box.classList.remove('opacity-100', 'translate-y-0');
        box.classList.add('opacity-0', '-translate-y-2');
      }, 2600);
    }

    function setConnectionBadge(status, label) {
      const badge = document.getElementById('connection-badge');
      const dot = document.getElementById('connection-dot');
      const text = document.getElementById('connection-text');
      text.textContent = label;

      badge.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold border';
      dot.className = 'w-1.5 h-1.5 rounded-full';

      if (status === 'ok') {
        badge.classList.add('bg-emerald-950/90', 'text-emerald-300', 'border-emerald-700');
        dot.classList.add('bg-emerald-400');
      } else if (status === 'loading') {
        badge.classList.add('bg-blue-950/90', 'text-blue-300', 'border-blue-700');
        dot.classList.add('bg-blue-400', 'animate-pulse-soft');
      } else if (status === 'error') {
        badge.classList.add('bg-rose-950/90', 'text-rose-300', 'border-rose-700');
        dot.classList.add('bg-rose-400');
      } else {
        badge.classList.add('bg-slate-800', 'text-slate-300', 'border-slate-700');
        dot.classList.add('bg-slate-400');
      }
    }

    function updateClock() {
      const now = new Date();
      const days = ['日', '月', '火', '水', '木', '金', '土'];
      const str = `${now.getMonth() + 1}/${now.getDate()}(${days[now.getDay()]}) ${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
      document.getElementById('header-date-clock').textContent = str;

      const eff = getEffectiveDeliveryDateObj();
      document.getElementById('delivery-date-chip').textContent = `${eff.getMonth() + 1}/${eff.getDate()}運行分`;
    }

    function normalizeStoreArray(arr) {
      return arr.map((item, idx) => ({
        order: Number(item.order || idx + 1),
        name: String(item.name || '').trim(),
        scheduled: String(item.scheduled || '').trim(),
        avgArrival: String(item.avgArrival || '').trim()
      })).filter(s => s.name);
    }

    function normalizeLogsArray(arr) {
      return arr.map(item => ({
        courseType: String(item.courseType || '1'),
        order: Number(item.order || 1),
        storeName: String(item.storeName || '').trim(),
        scheduled: String(item.scheduled || '').trim(),
        arrival: String(item.arrival || '').trim(),
        diffDisplay: String(item.diffDisplay || '').trim(),
        isHoliday: Boolean(item.isHoliday || item.arrival === '休業'),
        isExtraRun: Boolean(item.isExtraRun || item.arrival === '臨時便'),
        drSentTime: String(item.drSentTime || '').trim()
      }));
    }

    function getCacheKey() {
      return `${STORAGE_KEYS.SCHEDULE_CACHE}_${excelCarIndex}_${getFormattedDeliveryDateKey()}`;
    }

    function saveScheduleCacheToLocal() {
      try {
        const payload = {
          course1Code,
          course2Code,
          course1Stores,
          course2Stores,
          arrivalLogs,
          savedAt: Date.now()
        };
        localStorage.setItem(getCacheKey(), JSON.stringify(payload));
      } catch (e) {}
    }

    function restoreScheduleCacheFromLocal() {
      try {
        const raw = localStorage.getItem(getCacheKey());
        if (!raw) return false;
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.course1Stores)) {
          course1Code = parsed.course1Code || course1Code;
          course2Code = parsed.course2Code || course2Code;
          course1Stores = parsed.course1Stores;
          course2Stores = parsed.course2Stores || [];
          arrivalLogs = parsed.arrivalLogs || [];
          return true;
        }
      } catch (e) {}
      return false;
    }

    function calcDiffMinutes(scheduledStr, arrivalStr) {
      if (!scheduledStr || !arrivalStr || !scheduledStr.includes(':') || !arrivalStr.includes(':')) return 0;
      const [sh, sm] = scheduledStr.split(':').map(Number);
      const [ah, am] = arrivalStr.split(':').map(Number);
      if (isNaN(sh) || isNaN(sm) || isNaN(ah) || isNaN(am)) return 0;
      let diff = (ah * 60 + am) - (sh * 60 + sm);
      if (diff < -720) diff += 1440;
      if (diff > 720) diff -= 1440;
      return diff;
    }

    function formatDiffText(diffMin) {
      if (diffMin === 0) return '±0分';
      return diffMin > 0 ? `+${diffMin}分` : `${diffMin}分`;
    }

    function setupWheelColumn(el, count, onChange) {
      el.innerHTML = '';
      for (let i = 0; i < count; i++) {
        const div = document.createElement('div');
        div.className = 'wheel-item text-xl font-extrabold tabular-nums text-slate-700';
        div.textContent = pad2(i);
        div.dataset.val = i;
        div.addEventListener('click', () => {
          el.scrollTo({ top: i * 44, behavior: 'smooth' });
        });
        el.appendChild(div);
      }

      let scrollTimer = null;
      const updateHighlight = () => {
        const idx = Math.max(0, Math.min(count - 1, Math.round(el.scrollTop / 44)));
        const items = el.children;
        for (let i = 0; i < items.length; i++) {
          if (i === idx) {
            items[i].classList.add('text-blue-600', 'scale-110');
            items[i].classList.remove('text-slate-400', 'opacity-50');
          } else {
            items[i].classList.remove('text-blue-600', 'scale-110');
            items[i].classList.add('text-slate-400', 'opacity-50');
          }
        }
        return idx;
      };

      el.addEventListener('scroll', () => {
        const idx = updateHighlight();
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(() => {
          onChange(idx);
        }, 60);
      });

      return {
        setValue(val, smooth = false) {
          const clamped = ((val % count) + count) % count;
          el.scrollTo({ top: clamped * 44, behavior: smooth ? 'smooth' : 'auto' });
          updateHighlight();
          onChange(clamped);
        },
        getValue() {
          return Math.max(0, Math.min(count - 1, Math.round(el.scrollTop / 44)));
        }
      };
    }

    function initTimeSelectOptions() {
      const hourEl = document.getElementById('wheel-hour');
      const minEl = document.getElementById('wheel-minute');
      hourWheelController = setupWheelColumn(hourEl, 24, updateModalDiffPreview);
      minuteWheelController = setupWheelColumn(minEl, 60, updateModalDiffPreview);
    }

    function getSelectedWheelTime() {
      const h = hourWheelController ? hourWheelController.getValue() : 0;
      const m = minuteWheelController ? minuteWheelController.getValue() : 0;
      return `${pad2(h)}:${pad2(m)}`;
    }

    function setSelectedWheelTime(hhmm, smooth = false) {
      let h = 0;
      let m = 0;
      if (hhmm && hhmm.includes(':')) {
        const parts = hhmm.split(':').map(Number);
        if (!isNaN(parts[0])) h = parts[0];
        if (!isNaN(parts[1])) m = parts[1];
      } else {
        const now = new Date();
        h = now.getHours();
        m = now.getMinutes();
      }
      if (hourWheelController) hourWheelController.setValue(h, smooth);
      if (minuteWheelController) minuteWheelController.setValue(m, smooth);
      updateModalDiffPreview();
    }

    function updateModalDiffPreview() {
      if (!selectedStoreForModal) return;
      const arrStr = getSelectedWheelTime();
      const diff = calcDiffMinutes(selectedStoreForModal.scheduled, arrStr);
      const previewEl = document.getElementById('modal-diff-preview');
      previewEl.textContent = formatDiffText(diff);
      previewEl.className = 'text-sm font-extrabold tabular-nums';
      if (diff >= 31) {
        previewEl.classList.add('text-rose-600');
      } else if (diff > 0) {
        previewEl.classList.add('text-amber-600');
      } else {
        previewEl.classList.add('text-emerald-600');
      }
    }

    function updateExtraRunButtonUI() {
      const btn = document.getElementById('toggle-extra-btn');
      if (modalExtraRunFlag) {
        btn.textContent = '臨時便フラグ：ON';
        btn.className = 'py-2.5 px-3 rounded-xl bg-purple-600 text-white font-extrabold text-xs border border-purple-700 shadow-sm active:scale-95 transition';
      } else {
        btn.textContent = '臨時便フラグ：OFF';
        btn.className = 'py-2.5 px-3 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-800 font-extrabold text-xs border border-purple-200 active:scale-95 transition';
      }
    }

    function openArrivalModal(store, existingLog) {
      selectedStoreForModal = store;
      modalExtraRunFlag = existingLog ? Boolean(existingLog.isExtraRun) : false;
      updateExtraRunButtonUI();

      document.getElementById('modal-store-order').textContent = `${store.order}店舗目`;
      document.getElementById('modal-store-sched').textContent = store.scheduled ? `予定 ${store.scheduled}` : '予定なし';
      document.getElementById('modal-store-name').textContent = store.name;

      const drSection = document.getElementById('dr-sent-section');
      const drInput = document.getElementById('dr-sent-time-input');
      if (store.isLastStore) {
        drSection.classList.remove('hidden');
        if (existingLog && existingLog.drSentTime) {
          drInput.value = existingLog.drSentTime;
        } else {
          const now = new Date();
          drInput.value = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
        }
      } else {
        drSection.classList.add('hidden');
      }

      const modal = document.getElementById('arrival-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      const initialTime = (existingLog && existingLog.arrival && existingLog.arrival.includes(':'))
        ? existingLog.arrival
        : `${pad2(new Date().getHours())}:${pad2(new Date().getMinutes())}`;
      setTimeout(() => setSelectedWheelTime(initialTime, false), 20);
    }

    function closeArrivalModal() {
      const modal = document.getElementById('arrival-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      selectedStoreForModal = null;
    }

    function openArrivalModalWithHistory(store, existingLog) {
      openArrivalModal(store, existingLog);
      try {
        history.pushState({ modal: 'arrival' }, '');
      } catch (e) {}
    }

    function renderHistoryList() {
      const container = document.getElementById('history-list-container');
      container.innerHTML = '';
      if (arrivalLogs.length === 0) {
        container.innerHTML = '<div class="text-center py-8 text-xs font-bold text-slate-400">まだ本日の記録はありません</div>';
        return;
      }

      arrivalLogs.forEach(log => {
        const div = document.createElement('div');
        div.className = 'p-3 rounded-2xl bg-slate-50 border border-slate-200 flex items-center justify-between gap-2';
        div.innerHTML = `
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="px-1.5 py-0.5 rounded bg-slate-200 text-slate-700 text-[10px] font-extrabold">${log.courseType}便 #${log.order}</span>
              <span class="text-xs font-extrabold text-slate-900 truncate">${log.storeName}</span>
            </div>
            <div class="text-[11px] text-slate-500 mt-0.5 tabular-nums">予定 ${log.scheduled || '--:--'} ${log.drSentTime ? `/ DR ${log.drSentTime}` : ''}</div>
          </div>
          <div class="text-right shrink-0">
            <div class="text-sm font-black text-blue-700 tabular-nums">${log.arrival}</div>
            <div class="text-[11px] font-bold text-slate-500 tabular-nums">${log.diffDisplay || ''}</div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function renderDispatchMemoBanner() {
      const banner = document.getElementById('dispatch-memo-banner');
      if (!activeDispatchMemo || !activeDispatchMemo.message) {
        banner.classList.add('hidden');
        return;
      }
      document.getElementById('dispatch-memo-time').textContent = activeDispatchMemo.sentAt || '';
      document.getElementById('dispatch-memo-text').textContent = activeDispatchMemo.message;
      banner.classList.remove('hidden');
    }

    function renderStoreList() {
      renderDispatchMemoBanner();

      document.getElementById('tab-course-1-code').textContent = `(${course1Code})`;
      document.getElementById('tab-course-2-code').textContent = `(${course2Code})`;

      const logs1 = arrivalLogs.filter(l => l.courseType === '1' && l.arrival && l.arrival !== '臨時便');
      const logs2 = arrivalLogs.filter(l => l.courseType === '2' && l.arrival && l.arrival !== '臨時便');
      document.getElementById('tab-course-1-progress').textContent = `${logs1.length}/${course1Stores.length}`;
      document.getElementById('tab-course-2-progress').textContent = `${logs2.length}/${course2Stores.length}`;
      document.getElementById('history-count-badge').textContent = String(arrivalLogs.length);

      const tab1 = document.getElementById('tab-course-1');
      const tab2 = document.getElementById('tab-course-2');
      if (activeCourse === '1') {
        tab1.className = 'py-2 px-3 rounded-xl text-sm font-extrabold transition flex items-center justify-center gap-1.5 bg-blue-600 text-white shadow';
        tab2.className = 'py-2 px-3 rounded-xl text-sm font-extrabold transition flex items-center justify-center gap-1.5 text-slate-300 hover:text-white';
        document.getElementById('current-course-heading').textContent = `1便 (${course1Code}) 納品先一覧`;
      } else {
        tab2.className = 'py-2 px-3 rounded-xl text-sm font-extrabold transition flex items-center justify-center gap-1.5 bg-blue-600 text-white shadow';
        tab1.className = 'py-2 px-3 rounded-xl text-sm font-extrabold transition flex items-center justify-center gap-1.5 text-slate-300 hover:text-white';
        document.getElementById('current-course-heading').textContent = `2便 (${course2Code}) 納品先一覧`;
      }

      const stores = activeCourse === '1' ? course1Stores : course2Stores;
      const courseLogs = arrivalLogs.filter(l => l.courseType === activeCourse);
      const container = document.getElementById('store-list-container');
      container.innerHTML = '';

      if (stores.length === 0) {
        container.innerHTML = '<div class="bg-white rounded-2xl p-6 text-center text-xs font-bold text-slate-400 border border-slate-200">この便の納品先データはありません</div>';
        return;
      }

      let firstUnrecordedOrder = null;
      for (const st of stores) {
        const lg = courseLogs.find(l => Number(l.order) === Number(st.order));
        if (!lg || !lg.arrival || lg.arrival === '臨時便') {
          firstUnrecordedOrder = Number(st.order);
          break;
        }
      }

      stores.forEach((store, idx) => {
        const isLastStore = idx === stores.length - 1;
        const storeWithFlag = { ...store, isLastStore };
        const existingLog = courseLogs.find(l => Number(l.order) === Number(store.order));
        const isRecorded = existingLog && existingLog.arrival && existingLog.arrival !== '臨時便';
        const isNextTarget = !isRecorded && Number(store.order) === firstUnrecordedOrder;

        const card = document.createElement('button');
        card.type = 'button';
        card.className = `w-full text-left rounded-2xl p-3.5 transition active:scale-[0.99] border flex items-center justify-between gap-3 shadow-sm ${
          isRecorded
            ? 'bg-slate-50 border-slate-200/90'
            : isNextTarget
              ? 'bg-white border-blue-500 ring-2 ring-blue-500/20'
              : 'bg-white border-slate-200 opacity-85'
        }`;

        let statusHtml = '';
        if (isRecorded) {
          if (existingLog.isHoliday) {
            statusHtml = `<span class="px-2.5 py-1 rounded-xl bg-amber-100 text-amber-800 text-xs font-extrabold border border-amber-300">休業</span>`;
          } else {
            const diffStr = existingLog.diffDisplay || '';
            const isLate = diffStr.startsWith('+') && parseInt(diffStr, 10) >= 31;
            statusHtml = `
              <div class="text-right">
                <div class="text-base font-black tabular-nums ${isLate ? 'text-rose-600' : 'text-emerald-600'}">${existingLog.arrival}</div>
                <div class="text-[11px] font-extrabold tabular-nums ${isLate ? 'text-rose-500' : 'text-slate-500'}">${diffStr}</div>
              </div>
            `;
          }
        } else if (isNextTarget) {
          statusHtml = `<span class="px-3 py-1.5 rounded-xl bg-blue-600 text-white text-xs font-extrabold shadow-sm">到着入力</span>`;
        } else {
          statusHtml = `<span class="px-2.5 py-1 rounded-xl bg-slate-100 text-slate-400 text-xs font-bold">待機中</span>`;
        }

        card.innerHTML = `
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-8 h-8 rounded-xl flex items-center justify-center text-xs font-black shrink-0 ${
              isRecorded
                ? 'bg-emerald-100 text-emerald-700'
                : isNextTarget
                  ? 'bg-blue-600 text-white'
                  : 'bg-slate-100 text-slate-500'
            }">
              ${isRecorded ? '✓' : store.order}
            </div>
            <div class="min-w-0">
              <div class="flex items-center gap-1.5">
                <span class="text-sm font-extrabold text-slate-900 truncate">${store.name}</span>
                ${isLastStore ? '<span class="px-1.5 py-0.2 rounded bg-indigo-100 text-indigo-700 text-[10px] font-extrabold shrink-0">最終</span>' : ''}
                ${existingLog && existingLog.isExtraRun ? '<span class="px-1.5 py-0.2 rounded bg-purple-100 text-purple-700 text-[10px] font-extrabold shrink-0">臨時</span>' : ''}
              </div>
              <div class="flex items-center gap-2 mt-0.5 text-xs text-slate-500 tabular-nums">
                <span>予定 <strong class="text-slate-700">${store.scheduled || '--:--'}</strong></span>
                ${store.avgArrival ? `<span class="text-[11px] text-slate-400">(平均 ${store.avgArrival})</span>` : ''}
              </div>
            </div>
          </div>
          <div class="shrink-0">${statusHtml}</div>
        `;

        card.addEventListener('click', () => {
          if (!existingLog && firstUnrecordedOrder !== null && Number(store.order) > firstUnrecordedOrder) {
            const pendingStore = stores.find((s) => Number(s.order) === firstUnrecordedOrder);
            const pendingName = pendingStore ? pendingStore.name : `${firstUnrecordedOrder}店舗目`;
            showToast(`⚠️ 先に「${pendingName}」の到着記録を入力してください`);
            return;
          }
          openArrivalModalWithHistory(storeWithFlag, existingLog);
        });

        container.appendChild(card);
      });
    }

    async function fetchSheetData(silent = false) {
      if (!gasWebAppUrl) {
        setConnectionBadge('demo', 'デモ表示');
        renderStoreList();
        return;
      }

      if (isFetchingSheetData) {
        return;
      }
      isFetchingSheetData = true;

      const hasCached = restoreScheduleCacheFromLocal();
      if (hasCached) {
        renderStoreList();
      } else {
        setConnectionBadge('loading', '読込中...');
      }

      try {
        let data = null;
        let lastErr = null;
        for (let attempt = 0; attempt < 2; attempt++) {
          try {
            const query = new URLSearchParams({
              action: 'getSchedule',
              excelCarIndex: String(excelCarIndex),
              deliveryDate: getFormattedDeliveryDateKey(),
              _t: String(Date.now())
            });
            const res = await fetch(`${gasWebAppUrl}?${query.toString()}`, {
              method: 'GET',
              credentials: 'omit',
              cache: 'no-store',
              redirect: 'follow'
            });
            if (!res.ok) {
              throw new Error(`HTTP ${res.status}`);
            }
            const textData = await res.text();
            try {
              data = JSON.parse(textData);
            } catch (parseErr) {
              throw new Error('GAS権限エラー（アクセスできるユーザーを「全員」にしてください）');
            }
            lastErr = null;
            break;
          } catch (err) {
            lastErr = err;
            if (attempt === 0) {
              await new Promise((r) => setTimeout(r, 1200));
            }
          }
        }

        if (lastErr) {
          throw lastErr;
        }

        if (data && data.status === 'ok') {
          if (data.course1Code) course1Code = String(data.course1Code);
          if (data.course2Code) course2Code = String(data.course2Code);
          if (Array.isArray(data.course1Stores)) course1Stores = normalizeStoreArray(data.course1Stores);
          if (Array.isArray(data.course2Stores)) course2Stores = normalizeStoreArray(data.course2Stores);
          if (Array.isArray(data.existingLogs)) arrivalLogs = normalizeLogsArray(data.existingLogs);
          activeDispatchMemo = data.dispatchMemo || null;
          if (Array.isArray(data.chatMessages)) {
            chatMessagesList = data.chatMessages;
          }

          hasLoadedOnce = true;
          saveScheduleCacheToLocal();
          setConnectionBadge('ok', 'GAS接続済');
          if (!silent && !hasCached) {
            showToast('最新スケジュールを読み込みました');
          }

          if (typeof updateChatUnreadBadge === 'function') {
            updateChatUnreadBadge();
          }
          if (!document.getElementById('chat-sub-screen').classList.contains('hidden')) {
            renderChatMessages();
          }
        } else {
          if (!silent) {
            setConnectionBadge('error', '読込エラー');
            showToast(`エラー: ${(data && data.message) || '応答不正'}`);
          }
        }
      } catch (e) {
        if (!silent) {
          setConnectionBadge('error', '通信エラー');
          showToast(`通信失敗: ${e.message || e}`);
        } else if (hasLoadedOnce || hasCached) {
          setConnectionBadge('ok', 'GAS接続済');
        }
      } finally {
        isFetchingSheetData = false;
      }
      renderStoreList();
    }

    async function sendArrivalRecordToGas(payload) {
      if (!gasWebAppUrl) {
        showToast('デモモードでローカル記録しました');
        return true;
      }
      try {
        await fetch(gasWebAppUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        return true;
      } catch (e) {
        showToast('送信エラー：通信環境を確認してください');
        return false;
      }
    }

    function updateChatUnreadBadge() {
      const badge = document.getElementById('chat-unread-badge');
      const lastReadId = localStorage.getItem(STORAGE_KEYS.LAST_READ_CHAT_ID) || '';
      const officeMsgs = chatMessagesList.filter(m => m.sender === 'office');
      if (officeMsgs.length === 0) {
        badge.classList.add('hidden');
        return;
      }
      const latestOffice = officeMsgs[officeMsgs.length - 1];
      if (latestOffice && latestOffice.id !== lastReadId && document.getElementById('chat-sub-screen').classList.contains('hidden')) {
        badge.textContent = '1';
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function renderChatMessages() {
      const container = document.getElementById('chat-messages-container');
      container.innerHTML = '';

      if (chatMessagesList.length === 0) {
        container.innerHTML = '<div class="text-center py-10 text-xs font-bold text-slate-400">事務所との連絡履歴はまだありません</div>';
        return;
      }

      const officeMsgs = chatMessagesList.filter(m => m.sender === 'office');
      if (officeMsgs.length > 0) {
        localStorage.setItem(STORAGE_KEYS.LAST_READ_CHAT_ID, officeMsgs[officeMsgs.length - 1].id);
        updateChatUnreadBadge();
      }

      chatMessagesList.forEach(msg => {
        const isDriver = msg.sender === 'driver';
        const wrap = document.createElement('div');
        wrap.className = `flex flex-col ${isDriver ? 'items-end' : 'items-start'}`;

        const bubble = document.createElement('div');
        bubble.className = `max-w-[82%] rounded-2xl px-3.5 py-2.5 text-sm shadow-sm ${
          isDriver
            ? 'bg-blue-600 text-white rounded-br-sm'
            : 'bg-white text-slate-900 border border-slate-200 rounded-bl-sm'
        }`;

        let imgHtml = '';
        if (msg.imageData) {
          imgHtml = `<img src="${msg.imageData}" alt="添付画像" class="mt-1.5 rounded-xl max-h-48 object-contain bg-black/5" />`;
        }

        bubble.innerHTML = `
          <div class="whitespace-pre-wrap break-words font-medium leading-relaxed">${msg.text || ''}</div>
          ${imgHtml}
        `;

        const meta = document.createElement('div');
        meta.className = 'text-[10px] text-slate-400 mt-1 px-1 tabular-nums';
        meta.textContent = `${isDriver ? '送信' : '事務所'} ${msg.time || ''}`;

        wrap.appendChild(bubble);
        wrap.appendChild(meta);
        container.appendChild(wrap);
      });

      container.scrollTop = container.scrollHeight;
    }

    function syncChatViewportHeight() {
      const screen = document.getElementById('chat-sub-screen');
      if (screen.classList.contains('hidden')) return;
      if (window.visualViewport) {
        screen.style.height = `${window.visualViewport.height}px`;
        screen.style.top = `${window.visualViewport.offsetTop}px`;
      }
    }

    function populateSettingsModal() {
      const carSelect = document.getElementById('setting-car-select');
      const qrSelect = document.getElementById('qr-target-car-select');
      carSelect.innerHTML = '';
      qrSelect.innerHTML = '';

      for (let i = 0; i <= 34; i++) {
        const label = i === 0 ? '0号車（運行管理用）' : `${i}号車`;
        const opt1 = new Option(label, String(i));
        const opt2 = new Option(label, String(i));
        carSelect.add(opt1);
        qrSelect.add(opt2);
      }

      carSelect.value = String(excelCarIndex);
      qrSelect.value = String(excelCarIndex);
      document.getElementById('setting-gas-url').value = gasWebAppUrl;
      document.getElementById('setting-office-phone').value = officePhoneNumber;
    }

    document.addEventListener('DOMContentLoaded', () => {
      generateAppIcons();
      updateOfficeCallLink();
      initTimeSelectOptions();
      updateClock();
      setInterval(updateClock, 10000);

      if (gasWebAppUrl) {
        setConnectionBadge('loading', '更新中...');
      }

      const hasCached = restoreScheduleCacheFromLocal();
      renderStoreList();
      if (hasCached && gasWebAppUrl) {
        setConnectionBadge('ok', 'GAS接続済');
      }

      fetchSheetData(false);

      setInterval(() => {
        if (gasWebAppUrl && !document.hidden) {
          fetchSheetData(true);
        }
      }, 15000);

      document.getElementById('tab-course-1').addEventListener('click', () => {
        activeCourse = '1';
        renderStoreList();
      });

      document.getElementById('tab-course-2').addEventListener('click', () => {
        activeCourse = '2';
        renderStoreList();
      });

      let lastRefreshTap = 0;
      document.getElementById('refresh-btn').addEventListener('click', () => {
        const now = Date.now();
        if (now - lastRefreshTap < 600) {
          setConnectionBadge('loading', '更新中...');
          showToast('アプリを再読み込みしています...');
          setTimeout(() => window.location.reload(), 200);
          return;
        }
        lastRefreshTap = now;
        const icon = document.getElementById('refresh-icon');
        icon.classList.add('animate-spin');
        setTimeout(() => icon.classList.remove('animate-spin'), 700);
        fetchSheetData(false);
      });

      document.getElementById('office-call-link').addEventListener('click', (e) => {
        if (!officePhoneNumber) {
          e.preventDefault();
          showToast('歯車（⚙）から運行携帯の電話番号を設定してください');
        }
      });

      document.getElementById('close-arrival-modal-btn').addEventListener('click', closeArrivalModal);

      document.getElementById('set-now-time-btn').addEventListener('click', () => {
        const now = new Date();
        setSelectedWheelTime(`${pad2(now.getHours())}:${pad2(now.getMinutes())}`, true);
      });

      document.getElementById('minus-5min-btn').addEventListener('click', () => {
        const [h, m] = getSelectedWheelTime().split(':').map(Number);
        let total = h * 60 + m - 5;
        if (total < 0) total += 1440;
        setSelectedWheelTime(`${pad2(Math.floor(total / 60))}:${pad2(total % 60)}`, true);
      });

      document.getElementById('plus-5min-btn').addEventListener('click', () => {
        const [h, m] = getSelectedWheelTime().split(':').map(Number);
        const total = (h * 60 + m + 5) % 1440;
        setSelectedWheelTime(`${pad2(Math.floor(total / 60))}:${pad2(total % 60)}`, true);
      });

      document.getElementById('set-dr-now-btn').addEventListener('click', () => {
        const now = new Date();
        document.getElementById('dr-sent-time-input').value = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
      });

      document.getElementById('toggle-extra-btn').addEventListener('click', () => {
        modalExtraRunFlag = !modalExtraRunFlag;
        updateExtraRunButtonUI();
      });

      document.getElementById('submit-arrival-btn').addEventListener('click', async () => {
        if (!selectedStoreForModal) return;
        const store = selectedStoreForModal;
        const arrTime = getSelectedWheelTime();
        const diffMin = calcDiffMinutes(store.scheduled, arrTime);
        const diffDisp = diffMin === 0 ? '±0' : diffMin > 0 ? `+${diffMin}` : String(diffMin);
        const drSentTime = store.isLastStore ? (document.getElementById('dr-sent-time-input').value || '') : '';

        const payload = {
          excelCarIndex,
          courseType: activeCourse,
          storeOrder: store.order,
          storeName: store.name,
          scheduledTime: store.scheduled,
          arrivalTime: arrTime,
          diffMinutes: diffMin,
          isExtraRun: modalExtraRunFlag,
          isLastStore: store.isLastStore,
          drSentTime,
          deliveryDate: getFormattedDeliveryDateKey()
        };

        arrivalLogs = arrivalLogs.filter(l => !(l.courseType === activeCourse && Number(l.order) === Number(store.order)));
        arrivalLogs.push({
          courseType: activeCourse,
          order: store.order,
          storeName: store.name,
          scheduled: store.scheduled,
          arrival: arrTime,
          diffDisplay: diffDisp,
          isExtraRun: modalExtraRunFlag,
          drSentTime
        });
        saveScheduleCacheToLocal();
        closeArrivalModal();
        renderStoreList();
        showToast(`✅ ${store.name} (${arrTime}) を送信しました`);

        await sendArrivalRecordToGas(payload);
      });

      document.getElementById('submit-holiday-btn').addEventListener('click', async () => {
        if (!selectedStoreForModal) return;
        const store = selectedStoreForModal;
        const drSentTime = store.isLastStore ? (document.getElementById('dr-sent-time-input').value || '') : '';

        const payload = {
          excelCarIndex,
          courseType: activeCourse,
          storeOrder: store.order,
          storeName: store.name,
          scheduledTime: store.scheduled,
          arrivalTime: '休業',
          isHoliday: true,
          isLastStore: store.isLastStore,
          drSentTime,
          deliveryDate: getFormattedDeliveryDateKey()
        };

        arrivalLogs = arrivalLogs.filter(l => !(l.courseType === activeCourse && Number(l.order) === Number(store.order)));
        arrivalLogs.push({
          courseType: activeCourse,
          order: store.order,
          storeName: store.name,
          scheduled: store.scheduled,
          arrival: '休業',
          isHoliday: true,
          drSentTime
        });
        saveScheduleCacheToLocal();
        closeArrivalModal();
        renderStoreList();
        showToast(`⚠️ ${store.name} を「休業」で記録しました`);

        await sendArrivalRecordToGas(payload);
      });

      document.getElementById('confirm-memo-btn').addEventListener('click', async () => {
        if (!activeDispatchMemo) return;
        const memoId = activeDispatchMemo.memoId;
        activeDispatchMemo = null;
        renderDispatchMemoBanner();
        showToast('事務所伝言を確認済にしました');

        if (gasWebAppUrl) {
          try {
            await fetch(gasWebAppUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({
                action: 'confirmMemo',
                excelCarIndex,
                memoId
              })
            });
          } catch (e) {}
        }
      });

      document.getElementById('open-history-btn').addEventListener('click', () => {
        renderHistoryList();
        const modal = document.getElementById('history-modal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      });

      document.getElementById('close-history-modal-btn').addEventListener('click', () => {
        const modal = document.getElementById('history-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      });

      document.getElementById('open-settings-btn').addEventListener('click', () => {
        populateSettingsModal();
        const modal = document.getElementById('gas-modal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      });

      document.getElementById('close-gas-modal-btn').addEventListener('click', () => {
        const modal = document.getElementById('gas-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      });

      document.getElementById('save-gas-settings-btn').addEventListener('click', () => {
        const newCar = Number(document.getElementById('setting-car-select').value);
        const newUrl = document.getElementById('setting-gas-url').value.trim();
        const newPhone = document.getElementById('setting-office-phone').value.trim();

        excelCarIndex = newCar;
        gasWebAppUrl = newUrl;
        officePhoneNumber = newPhone;

        localStorage.setItem(STORAGE_KEYS.CAR_INDEX, String(excelCarIndex));
        localStorage.setItem(STORAGE_KEYS.GAS_URL, gasWebAppUrl);
        localStorage.setItem(STORAGE_KEYS.OFFICE_PHONE, officePhoneNumber);

        course1Code = String(100 + excelCarIndex);
        course2Code = String(200 + excelCarIndex);
        document.getElementById('header-car-label').textContent = excelCarIndex === 0 ? '0号車(管理)' : `${excelCarIndex}号車`;
        updateOfficeCallLink();

        const modal = document.getElementById('gas-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');

        hasLoadedOnce = false;
        fetchSheetData(false);
      });

      document.getElementById('generate-qr-btn').addEventListener('click', () => {
        const targetCar = document.getElementById('qr-target-car-select').value;
        const currentUrlInput = document.getElementById('setting-gas-url').value.trim() || gasWebAppUrl;
        const currentPhoneInput = document.getElementById('setting-office-phone').value.trim() || officePhoneNumber;

        const baseUrl = `${window.location.origin}${window.location.pathname}`;
        const qrParams = new URLSearchParams();
        qrParams.set('car', targetCar);
        if (currentUrlInput) qrParams.set('gas', currentUrlInput);
        if (currentPhoneInput) qrParams.set('phone', currentPhoneInput);

        const fullShareUrl = `${baseUrl}?${qrParams.toString()}`;
        const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(fullShareUrl)}`;

        document.getElementById('qr-code-img').src = qrApiUrl;
        document.getElementById('qr-target-label').textContent = targetCar === '0' ? '0号車（運行管理用）QRコード' : `${targetCar}号車 専用QRコード`;
        const area = document.getElementById('qr-display-area');
        area.classList.remove('hidden');
        area.classList.add('flex');
      });

      document.getElementById('open-chat-screen-btn').addEventListener('click', () => {
        document.getElementById('chat-header-title').textContent = `事務所連絡（${excelCarIndex}号車）`;
        renderChatMessages();
        const screen = document.getElementById('chat-sub-screen');
        screen.classList.remove('hidden');
        screen.classList.add('flex');
        syncChatViewportHeight();
        try {
          history.pushState({ screen: 'chat' }, '');
        } catch (e) {}
        if (gasWebAppUrl) fetchSheetData(true);
      });

      function closeChatSubScreen(fromPopState = false) {
        const screen = document.getElementById('chat-sub-screen');
        if (screen.classList.contains('hidden')) return;
        screen.classList.add('hidden');
        screen.classList.remove('flex');
        screen.style.height = '';
        screen.style.top = '';
        if (!fromPopState && history.state && history.state.screen === 'chat') {
          try {
            history.back();
          } catch (e) {}
        }
      }

      document.getElementById('close-chat-screen-btn').addEventListener('click', () => {
        closeChatSubScreen(false);
      });

      window.addEventListener('popstate', () => {
        const chatScreen = document.getElementById('chat-sub-screen');
        if (chatScreen && !chatScreen.classList.contains('hidden')) {
          closeChatSubScreen(true);
          return;
        }
        const arrivalModal = document.getElementById('arrival-modal');
        if (arrivalModal && !arrivalModal.classList.contains('hidden')) {
          closeArrivalModal();
          return;
        }
        const gasModal = document.getElementById('gas-modal');
        if (gasModal && !gasModal.classList.contains('hidden')) {
          gasModal.classList.add('hidden');
          gasModal.classList.remove('flex');
          return;
        }
        const historyModal = document.getElementById('history-modal');
        if (historyModal && !historyModal.classList.contains('hidden')) {
          historyModal.classList.add('hidden');
          historyModal.classList.remove('flex');
          return;
        }
      });

      document.getElementById('refresh-chat-btn').addEventListener('click', () => {
        fetchSheetData(true);
        showToast('メッセージを更新しました');
      });

      document.getElementById('chat-image-input').addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 640;
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            pendingChatImageBase64 = canvas.toDataURL('image/jpeg', 0.72);
            document.getElementById('chat-image-preview-thumb').src = pendingChatImageBase64;
            document.getElementById('chat-image-preview-bar').classList.remove('hidden');
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });

      document.getElementById('remove-chat-image-btn').addEventListener('click', () => {
        pendingChatImageBase64 = '';
        document.getElementById('chat-image-input').value = '';
        document.getElementById('chat-image-preview-bar').classList.add('hidden');
      });

      document.getElementById('send-chat-btn').addEventListener('click', async () => {
        const input = document.getElementById('chat-message-input');
        const text = input.value.trim();
        if (!text && !pendingChatImageBase64) return;

        const now = new Date();
        const timeStr = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
        const imgCopy = pendingChatImageBase64;

        chatMessagesList.push({
          id: `LOCAL_${Date.now()}`,
          sender: 'driver',
          text,
          time: timeStr,
          confirmed: true,
          imageData: imgCopy
        });

        input.value = '';
        pendingChatImageBase64 = '';
        document.getElementById('chat-image-input').value = '';
        document.getElementById('chat-image-preview-bar').classList.add('hidden');
        renderChatMessages();

        if (gasWebAppUrl) {
          try {
            await fetch(gasWebAppUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({
                action: 'sendDriverChat',
                excelCarIndex,
                message: text,
                imageData: imgCopy,
                sentAt: timeStr
              })
            });
          } catch (e) {}
        }
      });

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncChatViewportHeight);
        window.visualViewport.addEventListener('scroll', syncChatViewportHeight);
      }
    });

    initFromUrlOrStorage();
  </script>
